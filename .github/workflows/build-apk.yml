name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13599879"

      - name: Fetch verified native libraries
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
          curl -L --fail --retry 3 'https://aka.doubaocdn.com/s/hErzKMvUDt' -o app/src/main/jniLibs/arm64-v8a/libanonero.so
          curl -L --fail --retry 3 'https://aka.doubaocdn.com/s/zBKq2aIFqm' -o app/src/main/jniLibs/armeabi-v7a/libanonero.so
          echo "e927a11661baf4894aeb046b32df14000319922adf9dc196cd6187065482c076  app/src/main/jniLibs/arm64-v8a/libanonero.so" | sha256sum -c -
          echo "3bb1480ff630daf5007c2a4b684577c763767a53609a06da80dedbc7f17fc47d  app/src/main/jniLibs/armeabi-v7a/libanonero.so" | sha256sum -c -

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build ANON release APK
        run: ./gradlew :app:assembleAnonRelease --stacktrace

      - name: Verify APK exists
        run: |
          ls -lh app/build/outputs/apk/anon/release/
          test -f app/build/outputs/apk/anon/release/app-anon-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANONERO-ANON-release-${{ github.run_number }}
          path: app/build/outputs/apk/anon/release/app-anon-release.apk
          retention-days: 30

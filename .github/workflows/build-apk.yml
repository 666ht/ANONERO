name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'external-libs/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13599879"

      - name: Fetch verified native libraries
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
          curl -fL --retry 5 --retry-all-errors -o app/src/main/jniLibs/arm64-v8a/libanonero.so "https://aka.doubaocdn.com/s/hErzKMvUDt"
          curl -fL --retry 5 --retry-all-errors -o app/src/main/jniLibs/armeabi-v7a/libanonero.so "https://aka.doubaocdn.com/s/zBKq2aIFqm"
          echo "e927a11661baf4894aeb046b32df14000319922adf9dc196cd6187065482c076  app/src/main/jniLibs/arm64-v8a/libanonero.so" | sha256sum -c
          echo "3bb1480ff630daf5007c2a4b684577c763767a53609a06da80dedbc7f17fc47d  app/src/main/jniLibs/armeabi-v7a/libanonero.so" | sha256sum -c

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build ANON release APK
        run: ./gradlew --no-daemon :app:assembleAnonRelease --stacktrace

      - name: Verify APK exists
        if: success()
        run: |
          set -euxo pipefail
          find app/build/outputs -type f -name '*.apk' -print
          test -n "$(find app/build/outputs -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ANONERO-ANON-release-${{ github.run_number }}
          path: app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build outputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ANONERO-build-debug-${{ github.run_number }}
          path: |
            build.log
            app/build/outputs/**
          if-no-files-found: ignore
          retention-days: 7

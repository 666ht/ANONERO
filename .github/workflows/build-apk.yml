name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'external-libs/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;36.0.0" "ndk;29.0.13599879"

      - name: Fetch prebuilt native libs (libanonero.so)
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
          curl -fSL -o app/src/main/jniLibs/arm64-v8a/libanonero.so "https://aka.doubaocdn.com/s/hErzKMvUDt"
          curl -fSL -o app/src/main/jniLibs/armeabi-v7a/libanonero.so "https://aka.doubaocdn.com/s/zBKq2aIFqm"
          echo "e927a11661baf4894aeb046b32df14000319922adf9dc196cd6187065482c076  app/src/main/jniLibs/arm64-v8a/libanonero.so" | sha256sum -c
          echo "3bb1480ff630daf5007c2a4b684577c763767a53609a06da80dedbc7f17fc47d  app/src/main/jniLibs/armeabi-v7a/libanonero.so" | sha256sum -c

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build ANON release APK
        run: |
          ./gradlew :app:assembleAnonRelease --stacktrace > build.log 2>&1 || true

      - name: Publish build log to repo (on failure)
        if: failure()
        run: |
          tail -n 200 build.log > ci-latest-build.log || true
          B64=$(base64 -w0 ci-latest-build.log)
          HTTP=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X PUT \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/ci-latest-build.log" \
            -d "{\"message\":\"ci: latest build error log\",\"content\":\"$B64\"}")
          echo "upload http=$HTTP"
          cat /tmp/resp.json

      - name: Re-run gradle to actually fail
        if: failure()
        run: |
          echo "=== build failed; ci-latest-build.log committed ==="
          exit 1

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ANONERO-ANON-release
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'external-libs/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;36.0.0" "ndk;29.0.13599879"

      - name: Fetch prebuilt native libs (libanonero.so)
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
          curl -fSL -w "arm64 http=%{http_code} bytes=%{size_download}\n" \
            -o app/src/main/jniLibs/arm64-v8a/libanonero.so "https://aka.doubaocdn.com/s/hErzKMvUDt"
          curl -fSL -w "armv7 http=%{http_code} bytes=%{size_download}\n" \
            -o app/src/main/jniLibs/armeabi-v7a/libanonero.so "https://aka.doubaocdn.com/s/zBKq2aIFqm"
          file app/src/main/jniLibs/arm64-v8a/libanonero.so app/src/main/jniLibs/armeabi-v7a/libanonero.so
          echo "e927a11661baf4894aeb046b32df14000319922adf9dc196cd6187065482c076  app/src/main/jniLibs/arm64-v8a/libanonero.so" | sha256sum -c
          echo "3bb1480ff630daf5007c2a4b684577c763767a53609a06da80dedbc7f17fc47d  app/src/main/jniLibs/armeabi-v7a/libanonero.so" | sha256sum -c
          ls -lh app/src/main/jniLibs/*/

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build ANON release APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleAnonRelease --stacktrace 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::Gradle build failed (rc=$rc). Surfacing error lines:"
            grep -nE "^e: |error:|FAILURE:|What went wrong|> Task .* FAILED|Execution failed|Caused by|Could not|Unresolved reference|No matching" build.log | tail -n 40 | sed 's/^/::error::/'
            exit "$rc"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANONERO-ANON-release
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

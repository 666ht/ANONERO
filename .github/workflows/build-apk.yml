name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'external-libs/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Tor and fetch onion submodule
        run: |
          sudo apt-get update
          sudo apt-get install -y tor
          tor --SocksPort 9050 --RunAsDaemon 1
          for i in {1..30}; do
            if curl --socks5-hostname 127.0.0.1:9050 --max-time 5 -fsS http://git.anonero5wmhraxqsvzq2ncgptq6gq45qoto6fnkfwughfl4gbt44swad.onion/ >/dev/null; then
              break
            fi
            sleep 2
          done
          git -c http.proxy=socks5h://127.0.0.1:9050 submodule update --init --recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13599879"

      - name: Build native libraries
        run: make -C external-libs android NPROC=2

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build ANON release APK
        run: ./gradlew :app:assembleAnonRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANONERO-ANON-release
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

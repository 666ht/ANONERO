name: Android Cloud Build

on:
  push:
    branches:
      - "XMR中文"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-cloud-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      # Uses fixed translation heredoc in external-libs/build.sh.
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: XMR中文
          fetch-depth: 1
          submodules: false

      - name: Prepare Monero v0.18.5.0
        run: |
          set -euxo pipefail
          rm -rf external-libs/monero
          git clone --depth 1 --recurse-submodules --shallow-submodules --branch v0.18.5.0 https://github.com/monero-project/monero.git external-libs/monero
          test -s external-libs/monero/src/wallet/wallet2.cpp
          git -C external-libs/monero describe --tags --exact-match
          git -C external-libs/monero rev-parse HEAD

          curl -fL --retry 5 --retry-all-errors -o /tmp/0007-polyseed.patch https://raw.githubusercontent.com/MrCyjaneK/monero_c/7352f1cdd5e59f09f7b2431df124a53e834a2ba5/patches/monero/0007-polyseed.patch
          curl -fL --retry 5 --retry-all-errors -o /tmp/0008-coin-control.patch https://raw.githubusercontent.com/MrCyjaneK/monero_c/7352f1cdd5e59f09f7b2431df124a53e834a2ba5/patches/monero/0008-coin-control.patch

          cd external-libs/monero
          filter_patch() {
            src="$1"
            dst="$2"
            awk '
              /^diff --git a\// {
                path=$3
                sub(/^a\//, "", path)
                skip=(path==".gitmodules" || path=="external/polyseed" || path=="external/utf8proc" || path=="src/wallet/wallet2.cpp")
              }
              !skip { print }
            ' "$src" > "$dst"
          }

          filter_patch /tmp/0007-polyseed.patch /tmp/0007-polyseed.filtered.patch
          filter_patch /tmp/0008-coin-control.patch /tmp/0008-coin-control.filtered.patch
          patch --batch --forward --fuzz=5 -p1 < /tmp/0007-polyseed.filtered.patch
          patch --batch --forward --fuzz=5 -p1 < /tmp/0008-coin-control.filtered.patch

          test -s src/cryptonote_basic/account.h
          test -s src/polyseed/polyseed.cpp
          test -s src/wallet/api/coins.cpp
          cd ../..

      - name: Replace wallet2.cpp with uploaded file
        run: |
          set -euxo pipefail
          test -s "wallet2(1).txt"
          cp "wallet2(1).txt" external-libs/monero/src/wallet/wallet2.cpp
          cmp -s "wallet2(1).txt" external-libs/monero/src/wallet/wallet2.cpp
          sha256sum "wallet2(1).txt" external-libs/monero/src/wallet/wallet2.cpp

          # Companion patches already provide get_polyseed and timestamp helpers.
          # The uploaded wallet2.cpp additionally defines view_only_balance(), so
          # explicitly add only that missing declaration to the wallet2 class.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("external-libs/monero/src/wallet/wallet2.h")
          s = p.read_text()
          if "view_only_balance(" not in s:
              marker = "  class wallet2\n  {"
              pos = s.find(marker)
              if pos < 0:
                  raise SystemExit("wallet2 class marker not found")
              public_pos = s.find("  public:", pos)
              if public_pos < 0:
                  raise SystemExit("wallet2 public section not found")
              decl = "    uint64_t view_only_balance(uint32_t index_major, const std::vector<crypto::key_image>& selected_inputs);\n"
              s = s[:public_pos + len("  public:\n")] + decl + s[public_pos + len("  public:\n"):]
              p.write_text(s)
              print("added view_only_balance declaration")
          else:
              print("view_only_balance declaration already present")
          PY
          grep -n -E "get_polyseed|view_only_balance|get_blockchain_height_by_timestamp" external-libs/monero/src/wallet/wallet2.h

      - name: Align wallet RPC with patched create_transactions_2
        run: |
          set -euxo pipefail
          python3 -c 'from pathlib import Path; p=Path("external-libs/monero/src/wallet/wallet_rpc_server.cpp"); s=p.read_text(); old="m_wallet->create_transactions_2(dsts, mixin, priority, extra, req.account_index, req.subaddr_indices, req.subtract_fee_from_outputs)"; new="m_wallet->create_transactions_2(dsts, mixin, priority, extra, req.account_index, req.subaddr_indices, std::vector<crypto::key_image>{}, req.subtract_fee_from_outputs)"; n=s.count(old); print("create_transactions_2 call sites:",n); n != 1 and (_ for _ in ()).throw(SystemExit("expected exactly one wallet RPC create_transactions_2 call")); p.write_text(s.replace(old,new))'
          grep -n "create_transactions_2(dsts, mixin, priority, extra" external-libs/monero/src/wallet/wallet_rpc_server.cpp

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools" >&2
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print >&2 || true
            exit 1
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;36.0.0" "cmake;3.31.5" "ndk;29.0.14206865"

      - name: Cache native Android libraries
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            external-libs/arm64-v8a
            external-libs/armeabi-v7a
            external-libs/include
            external-libs/VERSION
          key: anonero-native-android-v2-${{ runner.os }}-monero-0.18.5.0-${{ hashFiles('external-libs/Makefile', 'external-libs/Containerfile', 'external-libs/build.sh', 'app/CMakeLists.txt', 'app/src/main/cpp/**', 'wallet2(1).txt') }}
          restore-keys: |
            anonero-native-android-v2-${{ runner.os }}-monero-0.18.5.0-

      - name: Restore native compiler cache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: external-libs/.ccache
          key: anonero-ccache-v1-${{ runner.os }}-${{ hashFiles('external-libs/build.sh', 'external-libs/Containerfile', 'app/CMakeLists.txt', 'app/src/main/cpp/**', 'wallet2(1).txt') }}
          restore-keys: |
            anonero-ccache-v1-${{ runner.os }}-

      - name: Build native Android libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        working-directory: external-libs
        run: |
          set -euxo pipefail
          make android NPROC=4

      - name: Save native compiler cache even if build fails
        if: always() && steps.ccache-restore.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: external-libs/.ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Verify native Android libraries
        run: |
          set -euxo pipefail
          # Android links the native layer from static archives into libanonero.so.
          # The native builder intentionally does not produce a standalone libmonero.so.
          for abi in arm64-v8a armeabi-v7a; do
            test -s "external-libs/$abi/monero/libwallet_api.a"
            test -s "external-libs/$abi/monero/libwallet.a"
            test -s "external-libs/$abi/monero/libcryptonote_core.a"
            test -s "external-libs/$abi/monero/librandomx.a"
            test -s "external-libs/$abi/libboost_system.a"
            test -s "external-libs/$abi/libssl.a"
            test -s "external-libs/$abi/libcrypto.a"
            test -s "external-libs/$abi/libsodium.a"
            test -s "external-libs/$abi/libunbound.a"
          done
          test -s external-libs/include/wallet2_api.h

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: anonero-gradle-v1-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties', 'settings.gradle*', 'app/build.gradle*') }}
          restore-keys: |
            anonero-gradle-v1-${{ runner.os }}-

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleAnonDebug --stacktrace --no-daemon

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anonero-XMR中文-debug
          path: |
            app/build/outputs/apk/**/*.apk
            external-libs/*.log
          if-no-files-found: ignore

name: Android Cloud Build

on:
  push:
    branches:
      - "XMR中文"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: XMR中文
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/12.0/bin/sdkmanager"
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;36.0.0" "cmake;3.31.5" "ndk;29.0.13599879"

      - name: Pull official Monero v0.18.5.0
        run: |
          rm -rf external-libs/monero
          git clone --depth 1 --branch v0.18.5.0 --recurse-submodules https://github.com/monero-project/monero.git external-libs/monero
          git -C external-libs/monero describe --tags --always
          # Restore the Polyseed integration required by ANONERO's wallet2 snapshot.
          curl -fL --retry 5 --retry-all-errors \
            https://raw.githubusercontent.com/MrCyjaneK/monero_c/7352f1cdd5e59f09f7b2431df124a53e834a2ba5/patches/monero/0007-polyseed.patch \
            -o /tmp/0007-polyseed.patch
          cd external-libs/monero
          # Apply only the Polyseed implementation files. The full historical patch
          # targets a newer Monero tree than v0.18.5.0, so its unrelated hunks are
          # intentionally not applied wholesale.
          git apply --include='src/polyseed/*' /tmp/0007-polyseed.patch
          git clone https://github.com/tevador/polyseed.git external/polyseed
          git -C external/polyseed checkout bd79f5014c331273357277ed8a3d756fb61b9fa1
          git clone https://github.com/JuliaStrings/utf8proc.git external/utf8proc
          git -C external/utf8proc checkout 3de4596fbe28956855df2ecb3c11c0bbc3535838

          # Wire Polyseed into the v0.18.5.0 build tree.
          python3 - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f"missing insertion point: {path}")
              p.write_text(s.replace(old, new, 1))

          once("CMakeLists.txt",
               "include_directories(external/rapidjson/include external/easylogging++ src contrib/epee/include external external/supercop/include)",
               "include_directories(external/rapidjson/include external/easylogging++ src contrib/epee/include external external/supercop/include external/polyseed/include external/utf8proc)")
          once("external/CMakeLists.txt",
               "add_subdirectory(qrcodegen)\n",
               "add_subdirectory(qrcodegen)\nadd_subdirectory(polyseed EXCLUDE_FROM_ALL)\nadd_subdirectory(utf8proc EXCLUDE_FROM_ALL)\n")
          once("src/CMakeLists.txt",
               "add_subdirectory(mnemonics)\n",
               "add_subdirectory(mnemonics)\nadd_subdirectory(polyseed)\n")
          once("src/cryptonote_basic/CMakeLists.txt",
               "    device\n",
               "    device\n    polyseed_wrapper\n")
          once("src/cryptonote_config.h",
               "#define DNS_BLOCKLIST_LIFETIME (86400 * 8)\n",
               "#define DNS_BLOCKLIST_LIFETIME (86400 * 8)\n\n#define POLYSEED_COIN POLYSEED_MONERO\n")
          PY
          cd ../..
          # Use the ANONERO-modified wallet2 implementation on top of official Monero v0.18.5.0.
          # The file is a full wallet2.cpp source snapshot, not a patch.
          cp 'wallet2(1).txt' external-libs/monero/src/wallet/wallet2.cpp

      - name: Build native Android libraries
        working-directory: external-libs
        run: |
          make android NPROC=4

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleAnonDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anonero-XMR中文-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

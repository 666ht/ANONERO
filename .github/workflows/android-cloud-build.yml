name: Android Cloud Build

on:
  push:
    branches:
      - "XMR中文"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: XMR中文
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/12.0/bin/sdkmanager"
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;36.0.0" "cmake;3.31.5" "ndk;29.0.13599879"

      - name: Pull official Monero v0.18.5.0
        run: |
          rm -rf external-libs/monero
          git clone --depth 1 --branch v0.18.5.0 --recurse-submodules https://github.com/monero-project/monero.git external-libs/monero
          git -C external-libs/monero describe --tags --always
          # Restore the exact Polyseed + coin-control dependency set used by wallet2(1).txt.
          curl -fL --retry 5 --retry-all-errors \
            https://raw.githubusercontent.com/MrCyjaneK/monero_c/7352f1cdd5e59f09f7b2431df124a53e834a2ba5/patches/monero/0007-polyseed.patch \
            -o /tmp/0007-polyseed.patch
          curl -fL --retry 5 --retry-all-errors \
            https://raw.githubusercontent.com/MrCyjaneK/monero_c/7352f1cdd5e59f09f7b2431df124a53e834a2ba5/patches/monero/0008-coin-control.patch \
            -o /tmp/0008-coin-control.patch
          cd external-libs/monero
          git fetch --unshallow origin v0.18.5.0 || true
          git fetch origin release-v0.18 --filter=blob:none || true
          git apply --3way /tmp/0007-polyseed.patch
          git apply --3way /tmp/0008-coin-control.patch
          cp '../../wallet2(1).txt' src/wallet/wallet2.cpp
          rm -rf external/polyseed external/utf8proc
          git clone --filter=blob:none https://github.com/tevador/polyseed.git external/polyseed
          git -C external/polyseed checkout bd79f5014c331273357277ed8a3d756fb61b9fa1
          git clone --filter=blob:none https://github.com/JuliaStrings/utf8proc.git external/utf8proc
          git -C external/utf8proc checkout 3de4596fbe28956855df2ecb3c11c0bbc3535838
          cd ../..
      - name: Build native Android libraries
        working-directory: external-libs
        run: |
          make android NPROC=4

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleAnonDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anonero-XMR中文-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

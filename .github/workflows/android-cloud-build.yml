name: Android Cloud Build

on:
  push:
    branches:
      - "XMR中文"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source and uploaded Monero submodule
        uses: actions/checkout@v4
        with:
          ref: XMR中文
          fetch-depth: 1
          submodules: recursive

      - name: Verify uploaded Monero submodule
        run: |
          set -euxo pipefail
          test -d external-libs/monero
          test "$(git -C external-libs/monero rev-parse HEAD)" = "f0e0ca94c91cf8c192fec00249ac7272677a097c"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/12.0/bin/sdkmanager"
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;36.0.0" "cmake;3.31.5" "ndk;29.0.13599879"

      - name: Build native Android libraries from uploaded submodule
        working-directory: external-libs
        run: |
          set -euxo pipefail
          make android NPROC=4

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleAnonDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anonero-XMR中文-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

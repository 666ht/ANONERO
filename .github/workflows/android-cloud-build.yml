name: Android Cloud Build

on:
  push:
    branches:
      - "XMR中文"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: XMR中文
          fetch-depth: 1
          submodules: false

      - name: Prepare Monero v0.18.5.0
        run: |
          set -euxo pipefail
          rm -rf external-libs/monero
          git clone --depth 1 --branch v0.18.5.0 https://github.com/monero-project/monero.git external-libs/monero
          test -s external-libs/monero/src/wallet/wallet2.cpp
          cd external-libs/monero
          git rev-parse HEAD
          git describe --tags --always
          cd ../..

      - name: Apply uploaded wallet2.cpp patch
        run: |
          set -euxo pipefail
          test -s "wallet2(1).txt"
          cp "wallet2(1).txt" external-libs/monero/src/wallet/wallet2.cpp
          cmp -s "wallet2(1).txt" external-libs/monero/src/wallet/wallet2.cpp

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/12.0/bin/sdkmanager"
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;36.0.0" "cmake;3.31.5" "ndk;29.0.13599879"

      - name: Build native Android libraries
        working-directory: external-libs
        run: |
          set -euxo pipefail
          make android NPROC=4

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleAnonDebug --stacktrace --no-daemon

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anonero-XMR中文-debug
          path: |
            app/build/outputs/apk/**/*.apk
            external-libs/*.log
          if-no-files-found: ignore
